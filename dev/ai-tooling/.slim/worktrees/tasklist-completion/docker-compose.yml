# Local KVNC devnet: four independent nodes on one user-defined network.
#
#   docker compose up --build
#
#  - each node has its own data volume, RPC port and validator seed
#  - node1 is the long-lived boot peer; node2..node4 dial it
#  - only node1's RPC is published (loopback)
#
# Every node writes genesis into its own data volume on a fresh start, so no
# genesis file is required. This is a devnet, not an attack surface: keep the
# ports bound to loopback and do not point peers at it.

name: kvnc-devnet

x-node: &node
  image: kvnc-node:local
  restart: unless-stopped
  init: true
  environment: &node-env
    KVNC_RPC_ADDR: "0.0.0.0"
    KVNC_LISTEN_ADDR: "0.0.0.0:9000"
    KVNC_DATA_DIR: "/var/lib/kvnc"
    KVNC_MAX_PEERS: "8"
    KVNC_ROUND_DURATION_MS: "1000"
    RUST_LOG: "info"
  # No config file is mounted: the KVNC_* variables above are the configuration.
  command: ["--config", "config.toml"]

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # Boot peer / the one node with a published RPC port.
  node1:
    <<: *node
    container_name: kvnc-node1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8545"
      KVNC_BOOTNODES: "node2:9000,node3:9000,node4:9000"
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - node1-data:/var/lib/kvnc
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8545/health"]

  node2:
    <<: *node
    container_name: kvnc-node2
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8546"
      KVNC_BOOTNODES: "node1:9000,node3:9000,node4:9000"
    volumes:
      - node2-data:/var/lib/kvnc
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8546/health"]

  node3:
    <<: *node
    container_name: kvnc-node3
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8547"
      KVNC_BOOTNODES: "node1:9000,node2:9000,node4:9000"
    volumes:
      - node3-data:/var/lib/kvnc
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8547/health"]

  node4:
    <<: *node
    container_name: kvnc-node4
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8548"
      KVNC_BOOTNODES: "node1:9000,node2:9000,node3:9000"
    volumes:
      - node4-data:/var/lib/kvnc
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8548/health"]

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data: