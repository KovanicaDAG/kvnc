[package]
name = "kvnc-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvnc-types = { path = "../kvnc-types" }
kvnc-common = { path = "../kvnc-common" }
kvnc-storage = { path = "../kvnc-storage" }
kvnc-consensus = { path = "../kvnc-consensus" }
kvnc-mempool = { path = "../kvnc-mempool" }
kvnc-staking = { path = "../kvnc-staking" }
kvnc-htlc = { path = "../kvnc-htlc" }
kvnc-vault = { path = "../kvnc-vault" }
kvnc-multisig = { path = "../kvnc-multisig" }
kvnc-token = { path = "../kvnc-token" }
kvnc-execution = { path = "../kvnc-execution" }
kvnc-dag = { path = "../kvnc-dag" }
# `ws` is not part of axum's default feature set; it enables the WebSocket
# upgrade extractor used by the subscription transport.
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
governor = { version = "0.7", features = ["std"] }
nonzero_ext = "0.1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.24"
kvnc-crypto = { path = "../kvnc-crypto" }
