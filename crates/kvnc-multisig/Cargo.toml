[package]
name = "kvnc-multisig"
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib: the fixed wasm32 entry-point ABI is compiled to a standalone .wasm;
# rlib: native dispatch (kvnc-execution) links the typed API directly.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kvnc-common = { path = "../kvnc-common" }
serde = { workspace = true }
bincode = { workspace = true }

[features]
default = ["std"]
std = ["kvnc-common/std"]
