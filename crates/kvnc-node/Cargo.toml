[package]
name = "kvnc-node"
version = "0.0.31"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kvnc-node"
path = "src/main.rs"

[dependencies]
kvnc-types = { path = "../kvnc-types" }
kvnc-crypto = { path = "../kvnc-crypto" }
kvnc-storage = { path = "../kvnc-storage" }
kvnc-dag = { path = "../kvnc-dag" }
kvnc-consensus = { path = "../kvnc-consensus" }
kvnc-network = { path = "../kvnc-network" }
kvnc-mempool = { path = "../kvnc-mempool" }
kvnc-execution = { path = "../kvnc-execution" }
kvnc-staking = { path = "../kvnc-staking" }
kvnc-rpc = { path = "../kvnc-rpc" }
kvnc-runtime = { path = "../kvnc-runtime" }
kvnc-common = { path = "../kvnc-common" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
hex = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
libp2p = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
redb = { workspace = true }
bincode = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core", "batch"] }
reqwest = { workspace = true }
