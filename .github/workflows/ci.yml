name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Required by the wasmi contract e2e test (kvnc-execution), which
          # builds kvnc-token for wasm32-unknown-unknown; without the target
          # the test skips and the wasm path is never exercised in CI.
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets
      - name: Upload quorum test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quorum-logs
          path: target/quorum-logs
          if-no-files-found: ignore
      - name: Run doc tests
        run: cargo test --doc

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@1.90
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with MSRV
        run: cargo build --all-targets

  release-check:
    name: Release Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --all-targets

  # ---------------------------------------------------------------------------
  # Per-crate status for foundation-owned crates (Exec-Foundation).
  # One matrix job per crate so pass/fail of fmt / clippy / test is visible per
  # crate in the PR checks list, plus one aggregated table in the run summary.
  # Each step uses continue-on-error so all three checks always run; the job
  # still fails at the end if any of them failed.
  # ---------------------------------------------------------------------------
  foundation-crates:
    name: Foundation (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [kvnc-types, kvnc-crypto, kvnc-common, kvnc-cli]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: foundation-${{ matrix.crate }}
      - name: fmt --check
        id: fmt
        continue-on-error: true
        run: cargo fmt -p ${{ matrix.crate }} -- --check
      - name: clippy -D warnings
        id: clippy
        continue-on-error: true
        run: cargo clippy -p ${{ matrix.crate }} --all-targets --all-features -- -D warnings
      - name: test
        id: test
        continue-on-error: true
        run: |
          cargo test -p ${{ matrix.crate }} --all-targets
          cargo test -p ${{ matrix.crate }} --doc
      - name: Record result
        if: always()
        env:
          CRATE: ${{ matrix.crate }}
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ pass";; failure) echo "❌ fail";; *) echo "⚪ $1";; esac; }
          row="| \`$CRATE\` | $(icon "$FMT") | $(icon "$CLIPPY") | $(icon "$TEST") |"
          mkdir -p foundation-result
          echo "$row" > "foundation-result/$CRATE.md"
          {
            echo "| crate | fmt | clippy | test |"
            echo "|---|---|---|---|"
            echo "$row"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-result-${{ matrix.crate }}
          path: foundation-result/
          retention-days: 5
      - name: Fail if any check failed
        if: steps.fmt.outcome != 'success' || steps.clippy.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "fmt=${{ steps.fmt.outcome }} clippy=${{ steps.clippy.outcome }} test=${{ steps.test.outcome }}"
          exit 1

  foundation-summary:
    name: Foundation summary
    runs-on: ubuntu-latest
    needs: foundation-crates
    if: always()
    steps:
      - name: Download per-crate results
        uses: actions/download-artifact@v4
        with:
          pattern: foundation-result-*
          path: results
          merge-multiple: true
      - name: Write summary table
        run: |
          {
            echo "## Foundation crates: fmt / clippy / test"
            echo
            echo "| crate | fmt | clippy | test |"
            echo "|---|---|---|---|"
            for c in kvnc-types kvnc-crypto kvnc-common kvnc-cli; do
              if [ -f "results/$c.md" ]; then cat "results/$c.md"; else echo "| \`$c\` | ⚪ no result | ⚪ no result | ⚪ no result |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
