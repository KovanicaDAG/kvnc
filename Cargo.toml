[workspace]
resolver = "2"
members = [
    "crates/kvnc-types",
    "crates/kvnc-crypto",
    "crates/kvnc-storage",
    "crates/kvnc-dag",
    "crates/kvnc-consensus",
    "crates/kvnc-mempool",
    "crates/kvnc-network",
    "crates/kvnc-runtime",
    "crates/kvnc-execution",
    "crates/kvnc-staking",
    "crates/kvnc-node",
    "crates/kvnc-cli",
    "crates/kvnc-rpc",
    "crates/kvnc-common",
    "crates/kvnc-htlc",
    "crates/kvnc-vault",
    "crates/kvnc-multisig",
    "crates/kvnc-token",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KVNC Team"]
license = "Apache-2.0"
repository = "https://github.com/your-org/kvnc"

[workspace.dependencies]
# Async
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }

# Crypto
blake3 = "=1.5.1"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "batch"] }
rand = "0.8"
hex = "0.4"

# Storage
redb = "2.1"
sled = "0.34"  # fallback option

# Error & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking (choose one later)
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify"] }
# iroh = "0.28"  # alternative

# WASM
wasmi = "0.40"  # deterministic interpreter – chosen for v1
# wasmtime = "25"  # alternative if needed later

# Utils
bytes = "1.7"
parking_lot = "0.12"
dashmap = "6.0"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1.19"

# Metrics
prometheus-client = "0.25"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
