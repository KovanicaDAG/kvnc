[package]
name = "kvnc-fuzz"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fuzz_block"
path = "fuzz_block.rs"

[[bin]]
name = "fuzz_tx"
path = "fuzz_tx.rs"

[[bin]]
name = "fuzz_vote"
path = "fuzz_vote.rs"

[[bin]]
name = "fuzz_consensus"
path = "fuzz_consensus.rs"

[dependencies]
kvnc-types = { path = "../crates/kvnc-types" }
kvnc-crypto = { path = "../crates/kvnc-crypto" }
kvnc-consensus = { path = "../crates/kvnc-consensus" }
kvnc-mempool = { path = "../crates/kvnc-mempool" }
kvnc-dag = { path = "../crates/kvnc-dag" }
kvnc-storage = { path = "../crates/kvnc-storage" }
kvnc-network = { path = "../crates/kvnc-network" }
anyhow = { workspace = true }
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
bincode = { workspace = true }