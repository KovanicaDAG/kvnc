# Phase 16.6 — Real 4-Node Quorum (2f+1 = 3 with 4 nodes)
# Each node runs as validator with its own key and data volume.
# Keys generated offline (ops/docker/validators/generate.sh); NOT committed.
name: kvnc-quorum-4

x-node: &node
  image: kvnc-node:local
  restart: unless-stopped
  init: true
  environment: &node-env
    KVNC_RPC_ADDR: "0.0.0.0"
    KVNC_LISTEN_ADDR: "0.0.0.0:9000"
    KVNC_DATA_DIR: "/var/lib/kvnc"
    KVNC_MAX_PEERS: "8"
    KVNC_ROUND_DURATION_MS: "1000"
    KVNC_RUN_VALIDATOR: "true"
    RUST_LOG: "info"
  # No config file: pure env + genesis file copied to data dir at start.
  # Each service mounts its own validator keystore + genesis_validators.toml.

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  node1:
    <<: *node
    container_name: kvnc-quorum-node1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8545"
      KVNC_BOOTNODES: "node2:9000,node3:9000,node4:9000"
      KVNC_VALIDATOR_KEY: "/var/lib/kvnc/validator.pem"
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - node1-data:/var/lib/kvnc
      - ./ops/docker/validators/val1.pem:/var/lib/kvnc/validator.pem:ro
      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kvnc/genesis_validators.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8545/health"]

  node2:
    <<: *node
    container_name: kvnc-quorum-node2
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8546"
      KVNC_BOOTNODES: "node1:9000,node3:9000,node4:9000"
      KVNC_VALIDATOR_KEY: "/var/lib/kvnc/validator.pem"
    ports:
      - "127.0.0.1:8546:8546"
    volumes:
      - node2-data:/var/lib/kvnc
      - ./ops/docker/validators/val2.pem:/var/lib/kvnc/validator.pem:ro
      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kvnc/genesis_validators.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8546/health"]

  node3:
    <<: *node
    container_name: kvnc-quorum-node3
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8547"
      KVNC_BOOTNODES: "node1:9000,node2:9000,node4:9000"
      KVNC_VALIDATOR_KEY: "/var/lib/kvnc/validator.pem"
    ports:
      - "127.0.0.1:8547:8547"
    volumes:
      - node3-data:/var/lib/kvnc
      - ./ops/docker/validators/val3.pem:/var/lib/kvnc/validator.pem:ro
      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kvnc/genesis_validators.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8547/health"]

  node4:
    <<: *node
    container_name: kvnc-quorum-node4
    depends_on:
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      KVNC_RPC_PORT: "8548"
      KVNC_BOOTNODES: "node1:9000,node2:9000,node3:9000"
      KVNC_VALIDATOR_KEY: "/var/lib/kvnc/validator.pem"
    ports:
      - "127.0.0.1:8548:8548"
    volumes:
      - node4-data:/var/lib/kvnc
      - ./ops/docker/validators/val4.pem:/var/lib/kvnc/validator.pem:ro
      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kvnc/genesis_validators.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8548/health"]

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
